<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light" />
    <title>Our Memories</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div id="app">
      <section id="view-loading" class="view" hidden>
        <p class="muted">読み込み中...</p>
      </section>

      <section id="view-login" class="view" hidden>
        <h1>Our Memories</h1>
        <p class="lede">2人だけの思い出マップ</p>
        <form id="login-form" novalidate>
          <label for="email">メールアドレス</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="username"
            inputmode="email"
            required
          />
          <label for="password">パスワード</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
          <p id="login-error" class="error" hidden></p>
          <button type="submit" id="login-button">Login</button>
        </form>
      </section>

      <section id="view-denied" class="view" hidden>
        <h1>Access denied</h1>
        <p>このアプリを利用する権限がありません。</p>
        <button type="button" id="denied-back-button">ログイン画面へ</button>
      </section>

      <section id="view-main" class="view" hidden>
        <h1>Our Memories</h1>
        <p>Logged in</p>
        <p id="main-user" class="muted"></p>
        <button type="button" id="logout-button">Logout</button>
      </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/client.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
